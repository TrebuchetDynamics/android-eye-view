name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository patterns
        run: ./scripts/check-no-secrets.sh
      - name: Scan Git history with free Gitleaks CLI
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner
